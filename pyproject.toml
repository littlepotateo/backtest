[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "0.1.0"
description = "Backtest trading and investment strategies from a plain description"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=15", "scipy>=1.11", "fastapi>=0.110", "uvicorn>=0.29",
  "jinja2>=3.1", "markdown>=3.5", "plotly>=5.20", "python-multipart>=0.0.9",
  "pypdf>=4", "certifi"]

[project.optional-dependencies]
dev = ["pytest>=8", "arch>=7", "scikit-learn>=1.4", "pyportfolioopt>=1.5", "httpx>=0.27"]

[project.scripts]
bt = "backtester.cli:main"

[tool.setuptools.packages.find]
include = ["backtester*"]

[tool.setuptools.package-data]
"backtester.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
